<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Weather homepage</title>
    <style>
        *{background: linear-gradient(to bottom,lightblue,blue)no-repeat;}
        .monday{color: orange;}
        .tuesday{color: aliceblue;}
        .wednesday{color: aqua;}
        .thursday{color: blanchedalmond;}
        .friday{color: chocolate;}
    </style>
</head>
<body>
    <u><h1>This weeks weather</H1></u>
    <p class="monday">Monday will be hot</p>
    <p class="tuesday">Tuesday will be snowy</p>
    <p class="wednesday">Wednesday will be rainy</p>
    <p class="thursday">Thursday will be cloudy</p>
    <p class="friday">Friday will be sunny</p>
</body>
</html>
