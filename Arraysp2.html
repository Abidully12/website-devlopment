<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArrarysP2</title>
</head>
<body>
    <h2>JS Array Methods</h2>
    <p>The Join() method joins array elements into a string and the pop()
        method removes the last element from an array.</p>
        <p id="myjoin"></p>
        <p id="mypop"></p>
        <p id="mypop2"></p>
        <script>
            var fruits = ["Banana","Orange","Apple", "Mango"];
            document.getElementById("myjoin").innerHTML =fruits.join("*");
            document.getElementById("mypop").innerHTML = fruits; fruits.pop();
            document.getElementById("mypop2").innerHTML = fruits; fruits.pop();
            
        </script>
</body>
</html>
