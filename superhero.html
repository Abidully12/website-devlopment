<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superhero</title>
    <style>
        body{
            background-color:blue;
            color: aquamarine;
            font-family: 'Times New Roman', Times, serif;
            
        }  
        .hero-name{
            font-size: 60px;
            font-weight: bold;
            color: beige;
            text-shadow: 3px 3px  orange;
        }
        .tagline{
            font-style: italic;
            color: lightblue;
            text-transform: capitalize;
        }
        .label{
            text-transform: uppercase;
            text-decoration: underline;
            color: azure;
        }
        .power{
            font-weight: bold;
        }
        .weaknesses{
            text-decoration: line-through;

        }
        .badge{
            font: size 28px;
            font-weight: bold;
            transform: rotate(15deg);

        }
    

    </style>
</head>
<body>
  <h1 class="hero-name">Thunder kid </h1>  
  <p class="tagline">The most powerful hero in the school </p>
  <h2 class="label">super powers</h2>
  <p class="power">Can run faster than a cheetah</p>
  <p class="power">Can lift a school bus</p>
  <h2 class="label">weaknesses</h2>
  <p class="weaknesses">Maths homework</p>
<p class="weaknesses">Broccoli</p>

    <p class="badge">Top Hero</p>
    <p class="made-by">Created by Abdullah</p>

</body>
</html>
