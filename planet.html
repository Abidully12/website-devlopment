<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet</title>
    <style>
        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }
        .card{
            background-color: whitesmoke;
            border: 3px solid blue;
            border-radius: 12px;
            padding: 20px;
            width: 200px;
        }
    </style>

</head>
<body>
    <h1>My planet cards</h1>
    <p>use a JS class to build planet cards</p>
    <button onclick="showPlanets()">show planets</button>
    <div class="cards">
        <div id="card1"></div>
        <div id="card2"></div>
        <div id="card3"></div>
    </div>
    <script>
        class planet{
            constructor(name, fact){
                this.name = name;
                this.fact = fact;
        }
            describe() {
                return this.name + ": "+ this.fact;
            }
            
            
        }
        function showPlanets(){
            let p1 = new planet("Earth","The only planet with life");
            let p2 = new planet("Mars","Known as the red planet");
            let p3 = new planet("saturn", "Planet with rings made of ice and dust");

            document.getElementById("card1").innerHTML=
            "<div class='card'><div class='planet-name'>"+p1.name +"</div>"+
            "<div class= 'planet' >"+ p1.describe()+"</div></div>";

            document.getElementById("card2").innerHTML =
            "<div class='card'><div class='planet-name'>" + p2.name + "</div>" +
            "<div class= 'planet' >" + p2.describe() + "</div></div>";

            document.getElementById("card3").innerHTML =
                "<div class='card'><div class='planet-name'>" + p3.name + "</div>" +
                "<div class= 'planet' >" + p3.describe() + "</div></div>";
        }
    </script>
</body>
</html>
