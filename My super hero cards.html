<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super heros</title>
    <style>
        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background-color: whitesmoke;
            border: 3px solid blue;
            border-radius: 12px;
            padding: 20px;
            width: 200px;
        }
    </style>

</head>

<body>
    <h1>My Super hero cards</h1>
    <p>use a JS class to build Super cards</p>
    <button onclick="showsuperheros()">show superheros</button>
    <div class="cards">
        <div id="card1"></div>
        <div id="card2"></div>
        <div id="card3"></div>
    </div>
    <script>
        class superhero{
            constructor(name,fact){
                this.name = name;
                this.fact = fact;
            }
            describe(){
                return this.name + ":"+ this.fact;
            }
        }
        function showsuperheros(){
            let p1 = new superhero("Superman","The man who could fly");
            let p2 = new superhero("Spiderman","The man who can shoot webs");
            let p3 = new superhero("batman","The richest superhero");

            document.getElementById("card1").innerHTML =
                "<div class='card'><div class='superhero-name'>" + p1.name + "</div>" +
                "<div class= 'superhero' >" + p1.describe() + "</div></div>";

            document.getElementById("card2").innerHTML =
                "<div class='card'><div class='superhero-name'>" + p2.name + "</div>" +
                "<div class= 'superhero' >" + p2.describe() + "</div></div>";

            document.getElementById("card3").innerHTML =
                "<div class='card'><div class='superhero-name'>" + p3.name + "</div>" +
                "<div class= 'superhero' >" + p3.describe() + "</div></div>";
        }
    </script>
</body>

</html>
