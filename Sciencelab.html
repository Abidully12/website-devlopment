<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sciencelab</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="jumbotron jumbotron-fluid" >
        <div class="container">
            <h1>My Science Lab</h1>
            <p class="lead">Welcome to the lab here the experiments.</p>
            <button class="btn btn-primary">Chemistry</button>
            <button class="btn btn-success">Biology</button>
            <button class="btn btn-warning">physics</button>
            <button class="btn btn-danger">Astronomy</button>
        </div>
    </div>

    <div class="container">
        <h2 class="section-title">Experiments completed <span class="badge badge-danger">4</span></h2>
        <p>Biology <span class="badge badge-primary">7 experiments</span></p>
        <p>Physics <span class="badge badge-success">5 experiments</span></p>
        <p>chemistry <span class="badge badge-info">4 experiments</span></p>
        <p>Astronomy <span class="badge badge-warning">3 experiments</span></p>
        <h2 class="section-title">Research progress</h2>
        <p>Chemistry</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary" style="width: 85%;">85%</div>
        </div>
        <p>Biology</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning" style="width: 70%;">70%</div>
        </div><p>Physics</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-info" style="width: 67%;">67%</div>
        </div><p>Astronomy</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-danger" style="width: 67%;">67%</div>
        </div>
        
        

    </div>

</body>
</html>
