<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobby card</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body{
            background-color: blue;
            font-family: 'Times New Roman', Times, serif;
            padding: 30px 15px;

        }
        h1{
            text-align: center;
            color: navy;
        }
        .hobby-card{
            text-align: center;
            border: 2px solid black;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #0a0e85;

        }
        .hobby-card h3{
            color: slateblue;
        }
    </style>
</head>
<body>
    <h1>My hobby Cards</h1>
    <div class="container">

        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Football</h3>
                    <p>I kick a ball with my foot</p>
                </div>

            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Gaming</h3>
                    <p>I play games with a controller</p>

                </div>
            
            </div><div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>chilling</h3>
                    <p>I chill with my friends</p>
                </div>
            
            </div>
        </div>
    </div>
    
</body>
</html>
