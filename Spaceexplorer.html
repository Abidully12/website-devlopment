<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Explorer</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-sm">
        <a class="navbar-brand" href="#">Planet Explorer</a>
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Planets</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Stars</a></li>
        </ul>
    </nav>
    <div class="container mt-4">
        <h4 class="section-title">Scanning the galaxy...</h4>
        <div class="spinner-border text-primary" role="status"></div>
        <div class="spinner-border text-warning" role="status"></div>
        <div class="spinner-border text-danger" role="status"></div>
    </div>
    <h4 class="section-title">Featured planets</h4>
    <div class="row">
      <div class="col-md-4">
        <div class="card">
        <div class="card-body">
            <h4 class="card-title">Earth</h4>
            <p class="card-text">Our home planet</p>
            <a href="#" class="btn btn-primary">Explore</a>
        </div>    
        </div>
      </div>  
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title">Mars</h4>
                <p class="card-text">The red planet</p>
                <a href="#" class="btn btn-primary">Explore</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title">Jupiter</h4>
                <p class="card-text">Biggest planet in our solar system</p>
                <a href="#" class="btn btn-primary">Explore</a>
            </div>
        </div>
    </div>
    </div>
    <h4 class="section-title">Browse more planets</h4>
    <ul class="pagination">
        <li class="page-item"><a href="#" class="page-link">Previous</a></li>
        <li class="page-item"><a href="#" class="page-link">1</a></li>
        <li class="page-item"><a href="#" class="page-link">2</a></li>
        <li class="page-item"><a href="#" class="page-link">3</a></li>
        <li class="page-item"><a href="#" class="page-link">Next</a></li>
    </ul>
</body> 
</html>
